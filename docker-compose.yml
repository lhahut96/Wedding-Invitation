name: wedding

services:
  app:
    container_name: wedding_app
    build: .
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wedding}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wedding}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wedding.entrypoints=websecure,web"
      - "traefik.http.routers.wedding.rule=Host(`${WEDDING_HOST:-wedding}.${DOMAINNAME_CLOUD_SERVER}`)"
      - "traefik.http.routers.wedding.middlewares=cloudflarewarp@file"
      - "traefik.http.routers.wedding.service=wedding-svc"
      - "traefik.http.services.wedding-svc.loadbalancer.server.port=3000"
    networks:
      - default
      - reverse-proxy

  db:
    container_name: wedding_postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wedding}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  default:
    name: wedding
  reverse-proxy:
    external: true
    name: lucas-proxy
