# Local development: expose Postgres on localhost for `npm run dev`.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db
#
# Hot-reload dev server in Docker (no host Node, no image rebuild per change):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up --build --watch dev
# then open http://localhost:3000 (stop `app` first if it is running: it uses the same port).
# Files are synced into the container by `develop.watch` (bind mounts of the project dir don't
# work when Docker runs in a VM that doesn't share it, e.g. this Colima setup).
services:
  app:
    ports:
      - "127.0.0.1:3000:3000"
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  dev:
    profiles: ["dev"]
    container_name: wedding_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wedding}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wedding}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env*
        - action: rebuild
          path: package.json
